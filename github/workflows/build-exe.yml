name: Build MirTimeLauncher EXE
on: [push]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name "MirTimeLauncher" --collect-all customtkinter launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: MirTimeLauncher-Windows
          path: dist/MirTimeLauncher.exe
